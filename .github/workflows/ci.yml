name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 编译与测试(${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux 桌面构建固定 22.04:webview_go 链接 webkit2gtk-4.0,24.04 仓库已移除
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Linux 桌面构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 运行测试
        run: go test ./...

      - name: 静态检查
        shell: bash
        run: |
          go vet ./...
          if [ "${RUNNER_OS}" = "Windows" ]; then
            CGO_ENABLED=0 go vet -tags desktop ./...
          else
            go vet -tags desktop ./...
          fi

      - name: 编译桌面版
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            CGO_ENABLED=0 go build -tags desktop ./cmd/tongtu
          else
            CGO_ENABLED=1 go build -tags desktop ./cmd/tongtu
          fi

      - name: 编译 headless 版并冒烟测试
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o bin/tongtu ./cmd/tongtu
          ./bin/tongtu help >/dev/null
          HOME="${RUNNER_TEMP}/tongtu-empty" ./bin/tongtu cred list >/dev/null
          if ./bin/tongtu app add x --local 1.2.3.4:1 >/tmp/tongtu-smoke.log 2>&1; then
            echo "期望 app add 在缺少域名参数时失败"
            cat /tmp/tongtu-smoke.log
            exit 1
          fi

  release-desktop:
    name: 桌面安装包(${{ matrix.os }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Linux 桌面构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: macOS .app + dmg(amd64 与 arm64)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # CGO 构建由 clang 链接:不指定部署目标时,会把 runner 当前的 macOS
          # 版本(如 26.x)写进 Mach-O 的 LC_BUILD_VERSION minos。Finder/LaunchServices
          # 按 minos 校验,旧系统用户双击会报"不能与此版本的 macOS 配合使用"
          # (而命令行运行不走该校验,故 CLI 正常、双击失败)。这里固定为 11.0,
          # 与 Info.plist 的 LSMinimumSystemVersion 一致。
          export MACOSX_DEPLOYMENT_TARGET=11.0
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH="$arch" go build -tags desktop -trimpath \
              -ldflags "-s -w" -o bin/tongtu ./cmd/tongtu
            rm -rf dist/TongTu.app
            mkdir -p dist/TongTu.app/Contents/MacOS dist/TongTu.app/Contents/Resources
            cp bin/tongtu dist/TongTu.app/Contents/MacOS/tongtu
            sed "s/__VERSION__/${version}/g" deploy/Info.plist > dist/TongTu.app/Contents/Info.plist
            cp assets/icon/tongtu.icns dist/TongTu.app/Contents/Resources/tongtu.icns
            # 无付费开发者证书:对 .app 做 ad-hoc 签名。Apple Silicon 内核强制要求
            # 每个可执行文件带有效签名,缺失会被判为"已损坏/版本不适配"并在图标上打禁止标。
            # 交叉编译出的 amd64 分片 Go 链接器不会补签,这里统一由 codesign 兜底。
            codesign --force --deep --sign - --timestamp=none dist/TongTu.app
            codesign --verify --deep --strict dist/TongTu.app
            # DMG 暂存目录:应用 + 「应用程序」软链(便于拖拽安装) + 自定义卷图标
            stage="$(mktemp -d)/dmg"
            mkdir -p "$stage"
            cp -R dist/TongTu.app "$stage/"
            ln -s /Applications "$stage/应用程序"
            cp assets/icon/tongtu.icns "$stage/.VolumeIcon.icns"
            rw="${stage}.rw.dmg"
            # detach 是异步的:上一轮 arm64 的同名卷若未完全卸载,本轮 amd64 的
            # create(内部会挂载同名临时卷)会因名字冲突报 "Resource busy"。
            # 先防御性卸掉任何残留的「通途」卷,再创建。
            hdiutil detach "/Volumes/通途" -force >/dev/null 2>&1 || true
            hdiutil create -volname 通途 -srcfolder "$stage" -ov -format UDRW "$rw"
            mnt="$(hdiutil attach -nobrowse -readwrite "$rw" | tail -1 | awk '{print $NF}')"
            SetFile -a C "$mnt" || true
            # -force 兜底并重试,确保卷完全卸载(否则下一轮 create 会 Resource busy)
            for _ in 1 2 3 4 5; do
              hdiutil detach "$mnt" -force >/dev/null 2>&1 && break
              sleep 2
            done
            hdiutil convert "$rw" -format UDZO -ov \
              -o "dist/tongtu_${GITHUB_REF_NAME}_darwin_${arch}_desktop.dmg"
            rm -f "$rw"
            ditto -c -k --keepParent dist/TongTu.app \
              "dist/tongtu_${GITHUB_REF_NAME}_darwin_${arch}_desktop.app.zip"
            rm -rf dist/TongTu.app "$stage"
          done

      - name: Windows 双 exe(amd64 与 arm64)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            pkg="tongtu_${GITHUB_REF_NAME}_windows_${arch}_desktop"
            mkdir -p "build/${pkg}"
            CGO_ENABLED=0 GOARCH="$arch" go build -tags desktop -trimpath \
              -ldflags "-s -w -H windowsgui" -o "build/${pkg}/tongtu-gui.exe" ./cmd/tongtu
            CGO_ENABLED=0 GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w" -o "build/${pkg}/tongtu.exe" ./cmd/tongtu
            cp README.md "build/${pkg}/"
            (cd build && 7z a -tzip "../dist/${pkg}.zip" "${pkg}" >/dev/null)
          done

      - name: Linux 桌面 tar.gz(amd64)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          pkg="tongtu_${GITHUB_REF_NAME}_linux_amd64_desktop"
          mkdir -p "build/${pkg}/icons" dist
          CGO_ENABLED=1 go build -tags desktop -trimpath -ldflags "-s -w" \
            -o "build/${pkg}/tongtu" ./cmd/tongtu
          cp README.md deploy/tongtu.desktop "build/${pkg}/"
          for size in 48 128 256; do
            install -D "assets/icon/png/icon-${size}.png" \
              "build/${pkg}/icons/hicolor/${size}x${size}/apps/tongtu.png"
          done
          (cd build && tar -czf "../dist/${pkg}.tar.gz" "${pkg}")

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*

  release-headless:
    name: headless 安装包
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 交叉编译并打包
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          mkdir -p dist build/release

          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for target in "${targets[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"
            package="tongtu_${version}_${os}_${arch}"
            package_dir="build/release/${package}"
            binary="${package_dir}/tongtu"

            if [ "${os}" = "windows" ]; then
              binary="${binary}.exe"
            fi

            mkdir -p "${package_dir}/deploy"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "${binary}" \
              ./cmd/tongtu

            cp README.md "${package_dir}/"
            cp deploy/com.tongtu.client.plist "${package_dir}/deploy/"

            if [ "${os}" = "windows" ]; then
              (cd build/release && zip -qr "../../dist/${package}.zip" "${package}")
            else
              (cd build/release && tar -czf "../../dist/${package}.tar.gz" "${package}")
            fi
          done

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: headless
          path: dist/*

  publish:
    name: 发布 Release
    needs: [release-desktop, release-headless]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 汇总产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          (cd dist && shasum -a 256 * > checksums.txt)

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "tongtu ${GITHUB_REF_NAME}" \
              --notes "自动发布 ${GITHUB_REF_NAME}。**桌面客户端**(托盘+原生窗口):macOS 下载 \`*_desktop.dmg\`,Windows 下载 \`*_windows_*_desktop.zip\`,Linux 下载 \`*_linux_*_desktop.tar.gz\`;或一键安装桌面版:\`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh\`(macOS 无证书,脚本自动 ad-hoc 签名并去 quarantine)。**macOS 用 DMG 拖拽安装**时会带 quarantine 隔离标记,双击可能没有任何反应(Gatekeeper 静默拦截),终端执行 \`xattr -dr com.apple.quarantine /Applications/TongTu.app\` 即可打开,或直接用上面的一键脚本免去这步。服务器/无图形环境用不带 \`_desktop\` 后缀的 headless 包(\`tongtu web\`)。"
          fi
